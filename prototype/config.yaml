# Sentinel — every tunable number in the system.
#
# IMPLEMENTATION-PLAN rule 3: if a threshold appears in a module instead of
# here, it is a bug waiting to be found on stage.
#
# Thresholds under `decision` are SEEDED FROM artifacts/calibration.json, which
# is produced by scripts/fit_probe.py. When the Kaggle full-scale run lands,
# regenerate calibration.json and revisit low_thr/high_thr — do not hand-tune
# them here and then claim the calibration produced them.

audio:
  sample_rate: 16000
  frame_ms: 20
  window_s: 3.0
  hop_s: 0.5
  # --- the Gap 3 gate. These two numbers were measured, not chosen. ---
  #
  # RMS floor below which a 20ms frame is line noise rather than speech.
  # 0.006 cleanly separates the demo's inter-segment noise (0.0008 RMS) from
  # actual speech frames (0.1+ RMS).
  vad_rms_floor: 0.006
  #
  # Fraction of a window's frames that must clear that floor. ASVspoof clips
  # are read speech with long pauses — only 30-42% of their frames are voiced
  # even before degradation — so this has to be low. Measured on the genuine
  # demo call, speaker risk against the enrolment reference by voiced ratio:
  #     0.00-0.05  ->  0.27  (degenerate: the embedding of near-silence)
  #     0.05-0.10  ->  0.24  (degenerate)
  #     0.10-0.20  ->  0.19
  #     0.20-0.35  ->  0.15
  #     0.35+      ->  0.11  (clean)
  # Below 0.10 the embedding stops being about the speaker and starts being
  # about the silence, which inflates risk on genuine calls. 0.10 is where the
  # numbers become monotonic and trustworthy. It scores ~67% of windows.
  vad_min_voiced_ratio: 0.10
  #
  # Backstop inside the speaker adapter, below the VAD. Resemblyzer does NOT
  # raise on digital silence — it returns a plausible unit-norm embedding that
  # scores 0.31 risk, i.e. it would report silence as VERIFIED. Nothing about
  # that vector is structurally distinguishable from a real one, so the only
  # possible guard is on input energy.
  min_embed_rms: 0.0015

models:
  cm_backbone_id: facebook/wav2vec2-base
  probe_head_path: artifacts/probe_head.npz
  calibration_path: artifacts/calibration.json
  device: auto              # auto -> MPS on Apple Silicon, else CPU

  asr_model_id: base.en
  asr_device: cpu
  asr_compute_type: int8

  trigger_encoder_id: sentence-transformers/all-MiniLM-L6-v2

  # Empty = the standard huggingface_hub cache (~/.cache/huggingface/hub).
  # Leave it empty. detector/src/probe_model.py calls from_pretrained() with no
  # cache_dir, so pointing this elsewhere creates a second cache that the
  # countermeasure never reads — and the demo dies offline.
  hf_cache_dir: ""
  asr_cache_dir: artifacts/models/asr

trigger:
  # --- both numbers are MARGINS, not similarities. ---
  #
  # Raw cosine similarity to the intent sentences does not work. Measured on
  # MiniLM with this intent set:
  #     high-risk paraphrases   0.44 - 0.65
  #     ordinary banking talk   0.25 - 0.61
  # The ranges overlap; no threshold exists. A general-purpose encoder measures
  # topical relatedness, and everything on a banking call is about banking.
  #
  # So stage 2 scores the difference instead:
  #     margin = sim(nearest fraud intent) - sim(nearest benign anchor)
  # Measured over the curated set:
  #     15 clear positives    +0.28 to +0.73
  #     4 hard paraphrases    +0.08 to +0.22
  #     15 negatives          -0.59 to -0.01
  # and over 12 HELD-OUT negatives never used for tuning: -0.30 to +0.15.
  #
  # 0.05 keeps every positive, every paraphrase we claim to catch, and all 15
  # curated negatives. It misfires on 1 of the 12 held-out sentences — that one
  # is named in intents.py KNOWN_FALSE_POSITIVES rather than tuned away.
  semantic_margin: 0.05
  #
  # A stage-1 keyword hit needs less semantic evidence, because the keyword is
  # itself evidence — but it still must not be closer to normal call content
  # than to fraud. This is the line that kills "I'll transfer you to the other
  # line" (keyword hit, margin -0.10).
  #
  # Not zero: real ASR fragments can land marginally positive by chance, and a
  # spurious keyword plus +0.01 of margin is not evidence of anything. Genuine
  # keyword-bearing instructions clear +0.18, so this buffer costs nothing.
  lexical_confirm_floor: 0.02
  #
  # A bare word is not an instruction.
  min_words: 3

  # Injected transcript lines for ASVspoof demo audio, which is read speech and
  # contains no financial instruction. Rendered in the UI with a visible
  # "SCRIPTED" marker — see IMPLEMENTATION-PLAN 2.6. Switch off (empty list)
  # for the teammate-cloned audio, which says the transfer line for real.
  scripted_overlay:
    - t_ms: 16000
      text: "Sir this is regarding the vendor settlement we discussed."
    - t_ms: 21000
      text: "I need you to transfer two crore to this account tonight."
    - t_ms: 26000
      text: "Please don't call the branch, there isn't time for the usual approval."

gating:
  mode: triggered           # triggered | always_on
  pre_roll_s: 3.0           # score backwards from the trigger
  hold_s: 10.0

decision:
  # NOT hand-picked. Copied verbatim from calibration.json -> decision_band,
  # which derives them as eer_threshold (0.4220) -/+ half a standard deviation
  # of each class's fused score. On the 119 pilot trials that band gives:
  #   genuine -> 35 verified /  7 uncertain / 2 flagged
  #   spoof   -> 61 flagged  / 11 uncertain / 3 verified
  # Anything between the two is UNCERTAIN, which is the system working
  # correctly, not failing (SPEC §7.4). Regenerate with scripts/fit_probe.py
  # when the Kaggle full run lands; do not nudge these by hand and then claim
  # the calibration produced them.
  low_thr: 0.3636
  high_thr: 0.4575
  fusion: mean              # mean | logistic
  min_windows: 2
  # Windows at or above this fused risk get listed in the evidence panel.
  # Sits at the top of the band so the panel shows what actually pushed the
  # verdict, not every window that merely wobbled.
  evidence_risk_floor: 0.4575

server:
  host: 127.0.0.1
  port: 8000
  static_dir: sentinel/server/static
  event_queue_size: 1000    # UI events: drop oldest, count drops
  asr_queue_size: 200       # ASR frames: block, never drop — a gap is a missed trigger
  # SPEC §12: "if pipeline_lag_ms exceeds real time, show it." One hop (500 ms)
  # is the honest line — the loop gets a full hop to produce each window's
  # scores, so anything past that means we are not keeping up and the screen
  # says so rather than quietly claiming to be real-time. Measured lag on the
  # demo calls is 0 ms, so this never fires on the safe path; it exists for the
  # live-microphone case and for a slower machine.
  lag_warn_ms: 500

asr:
  # Utterance boundaries. whisper only runs once the silence detector has
  # decided a sentence ended, so silence_to_cut_ms is the biggest lever on live
  # latency. 500 ms is what the recorded demo has always used; shortening it
  # for live costs context, so measure before changing (PLAN-LIVE M2).
  silence_to_cut_ms: 500
  min_utterance_ms: 700
  max_utterance_ms: 12000

live:
  # The browser-microphone path. See PLAN-LIVE.md §5.
  max_session_s: 900       # a forgotten open mic should not grow for hours
  queue_frames: 400        # 8 s of 20 ms chunks before oldest-first dropping
  no_audio_warn_ms: 700    # macOS denies the mic by returning SILENCE

lookup:
  # MEASURED — scripts/calibrate_lookup.py, detector/data/pilot, LA_0022
  # (artifacts/lookup_calibration.json carries the full distributions).
  #
  #   same speaker, clean   0.9163 - 0.9252
  #   same speaker, mobile  0.8777 - 0.8995
  #   different speaker     n=258  p50 0.8059  p99 0.8998  max 0.9183
  #
  # The sets OVERLAP, and that is the honest pilot-scale result rather than a
  # tuning problem: a degraded mobile channel pulls genuine scores down into
  # the impostor tail. The rule sets the threshold at the impostor p99, which
  # accepts 2 of 4 same-speaker pairs and 3 of 258 impostors. Conservative on
  # purpose -- refusing a genuine speaker shows as "unknown voice" (a visible
  # miss), while accepting a stranger would put a wrong name on screen.
  #
  # This signal is NOT fused into the verdict. It is shown beside the risk, and
  # the demo presents "unknown voice" as a legitimate outcome.
  #
  # The live demo's easy case: enrolment and the call come from the same clean
  # microphone, which is not the degraded channel this table measures.
  accept_similarity: 0.8998
  # One enrolled speaker cannot measure a runner-up margin, so this stays a
  # configured guard rather than a measured number -- stated in the report.
  min_margin: 0.05
  min_consecutive_windows: 2   # a name needs two consecutive windows

paths:
  enrolments_dir: artifacts/enrolments
  demo_dir: artifacts/demo
  evidence_dir: artifacts/evidence
